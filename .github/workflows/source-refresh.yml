name: Review upstream evidence changes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compare pinned implementation evidence
        env:
          GH_TOKEN: ${{ secrets.DOCS_SOURCE_TOKEN || github.token }}
          DOCS_AUDIENCE: ${{ vars.DOCS_AUDIENCE || 'public' }}
        run: node scripts/source-refresh.mjs --write
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: docs/upstream-evidence-review
          add-paths: sources/drift.json
          commit-message: 'docs: report changed upstream implementation evidence'
          title: 'Review changed implementation evidence'
          body: 'Review the changed files against affected pages and diagrams. This proposal does not change source pins, prose or verification status.'
          draft: true
