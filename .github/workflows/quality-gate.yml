name: Documentation quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true
env:
  DOCS_AUDIENCE: ${{ vars.DOCS_AUDIENCE || 'public' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate && npm test
      - run: npx markdownlint-cli2
      - run: npm run build && npm run check:links
      - run: npm run typecheck
      - name: Browser evidence for diagrams
        run: npm run diagrams:visual
      - name: Site browser checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run check:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: documentation-evidence
          path: .artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/build/
  preview:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation-site
          path: site/build
      - name: Deploy trusted preview artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_PAGES_PROJECT: ${{ vars.DOCS_PAGES_PROJECT }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: npx wrangler pages deploy site/build --project-name "$DOCS_PAGES_PROJECT" --branch "$PREVIEW_BRANCH"
